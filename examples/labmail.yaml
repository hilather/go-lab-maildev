# mcp-integration-lab overlay: copy to profiles/default/labmail/bootstrap.yaml
# and mount at /etc/labmail/config.yaml. Not the DEP-001 compose-smoke
# bootstrap (that file must not gain these /run/secrets refs unless the
# smoke compose mints and mounts them). allowLegacyClients is on so
# MCPJungle (mark3labs/mcp-go v0.48) can register without a LabMail patch
# (D17). SMTP AUTH stays off so smoke SendMail(..., nil, ...) still works.
# Basic username is frozen admin (YAML does not interpolate MAILDEV_WEB_USER).
# Bind-mounted secret files must be 0o644 (UID 65532).
apiVersion: labmail.dev/v1alpha1
kind: LabMail
metadata:
  name: lab-sink
spec:
  listeners:
    smtp:
      address: ":1025"
    management:
      address: ":1080"
      restPath: /v1
      mcpPath: /mcp
      compatEnabled: true
      tls:
        enabled: false
        certFile: ""
        keyFile: ""

  smtp:
    hostname: labmail.lab
    maxMessageBytes: 10MiB
    maxRecipients: 100
    hideExtensions: []
    auth:
      mode: none
      username: ""
      passwordFile: ""
    tls:
      mode: off
      required: false
      certFile: ""
      keyFile: ""
    admission:
      maxSessions: 256
      maxSessionsPerIP: 32
      maxInFlightData: 8
      maxInFlightDataBytes: 64MiB
      sessionTimeout: 10m
      commandIdle: 120s
      dataIdle: 180s

  store:
    maxMessages: 1000
    maxBytes: 256MiB
    fullPolicy: reject
    maxWait: 60s
    spillDirectory: ""
    spillThreshold: 256KiB

  ui:
    enabled: true

  management:
    auth:
      mode: bearer_and_basic
      tokens:
        - id: admin
          secretFile: /run/secrets/labmail-token
          role: administrator
          scopes: [mail.read, mail.write, mail.admin, mail.audit.read]
      basic:
        username: admin
        passwordFile: /run/secrets/maildev-web-password
        tokenRef: admin
    mcp:
      allowLegacyClients: true
    originAllowlist: []            # default deny; do not ship "*"
    bodyLimit: 1MiB
    requestsPerSecond: 32
    burst: 64
    maxConcurrent: 256

  observability:
    logLevel: info
    metrics:
      listen: "127.0.0.1:9090"
      publicPath: false
    audit:
      ring: 128

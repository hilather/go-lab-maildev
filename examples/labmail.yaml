# Operator-facing LabMail bootstrap for examples/compose.smoke.yaml.
# Default container YAML is bearer_and_basic. Token/password file mounts
# land with SEC-001 / SWAP-001; empty tokens keep this valid today.
apiVersion: labmail.dev/v1alpha1
kind: LabMail
metadata:
  name: lab-sink
spec:
  listeners:
    smtp:
      address: ":1025"
    management:
      address: ":1080"
      restPath: /v1
      mcpPath: /mcp
      compatEnabled: true
  smtp:
    hostname: labmail.lab
    maxMessageBytes: 10MiB
    maxRecipients: 100
    auth:
      mode: none
    tls:
      mode: off
      required: false
  store:
    maxMessages: 1000
    maxBytes: 256MiB
    fullPolicy: reject
    spillDirectory: ""
  ui:
    enabled: true
  management:
    auth:
      mode: bearer_and_basic
    mcp:
      allowLegacyClients: false
    originAllowlist: []
    bodyLimit: 1MiB
    requestsPerSecond: 32
    burst: 64
    maxConcurrent: 256
  observability:
    logLevel: info
    metrics:
      listen: "127.0.0.1:9090"
      publicPath: false
    audit:
      ring: 128

apiVersion: labmail.dev/v1alpha1
kind: LabMail
metadata:
  name: lab-sink
  labels:
    env: lab
spec:
  listeners:
    smtp:
      address: ":1025"
    management:
      address: ":1080"
      restPath: /v1
      mcpPath: /mcp
      compatEnabled: true
      tls:
        enabled: false
        certFile: ""
        keyFile: ""
  smtp:
    hostname: labmail.lab
    maxMessageBytes: 10MiB
    maxRecipients: 100
    hideExtensions: []
    auth:
      mode: none
      username: ""
      passwordFile: ""
    tls:
      mode: off
      required: false
      certFile: ""
      keyFile: ""
    admission:
      maxSessions: 256
      maxSessionsPerIP: 32
      maxInFlightData: 8
      maxInFlightDataBytes: 64MiB
      sessionTimeout: 10m
      commandIdle: 120s
      dataIdle: 180s
    behavior:
      greetingDelay: 0s
      commandDelay: 0s
      dropOnConnect: false
      closeAfterVerb: ""
      replies:
        greeting: ""
        helo: ""
        ehlo: ""
        mail: ""
        rcpt: ""
        data: ""
        dataEnd: ""
        rset: ""
        noop: ""
        vrfy: ""
        auth: ""
        starttls: ""
        unknown: ""
  store:
    maxMessages: 1000
    maxBytes: 256MiB
    fullPolicy: reject
    maxWait: 60s
    spillDirectory: ""
    spillThreshold: 256KiB
  ui:
    enabled: true
  management:
    auth:
      mode: bearer_and_basic
      tokens: []
      basic:
        username: ""
        passwordFile: ""
        tokenRef: ""
    mcp:
      allowLegacyClients: false
    originAllowlist: []
    bodyLimit: 1MiB
    requestsPerSecond: 32
    burst: 64
    maxConcurrent: 256
  observability:
    logLevel: info
    metrics:
      listen: "127.0.0.1:9090"
      publicPath: false
    audit:
      ring: 128

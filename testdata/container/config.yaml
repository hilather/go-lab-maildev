# Minimal local-only bootstrap for container contract tests.
# Health live/ready stay unauthenticated. Inbox reads use the smoke token.
apiVersion: labmail.dev/v1alpha1
kind: LabMail
metadata:
  name: container-smoke
spec:
  listeners:
    smtp:
      address: ":1025"
    management:
      address: ":1080"
      restPath: /v1
      mcpPath: /mcp
      compatEnabled: true
  smtp:
    hostname: labmail.lab
  store:
    maxMessages: 100
    maxBytes: 8MiB
    fullPolicy: reject
  ui:
    enabled: false
  management:
    auth:
      mode: bearer_and_basic
      tokens:
        - id: smoke
          secretFile: /etc/labmail/token
          role: administrator
          scopes: [mail.read, mail.write, mail.admin, mail.audit.read]
  observability:
    logLevel: info
    metrics:
      listen: ""
      publicPath: false
